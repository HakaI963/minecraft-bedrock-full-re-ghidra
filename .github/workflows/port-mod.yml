name: Port BlueCube mod to 1.26.66.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PAYLOAD_TAG: v126661-payload
      RESULT_TAG: v126661-result
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils zstd unzip zip sqlite3
          sudo fallocate -l 8G /swapfile-re && sudo chmod 600 /swapfile-re && sudo mkswap /swapfile-re >/dev/null && sudo swapon /swapfile-re
      - name: Download new library and database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work out
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" --dir work --clobber
          gh release download "$RESULT_TAG" --repo "${{ github.repository }}" --pattern 'minecraft_re.db.zst' --dir work --clobber
          zstd -dq -f work/minecraft_re.db.zst
          sha256sum work/libminecraftpe.so
          ls -lh work
      - name: Migrate signatures (pass 1 + fuzzy pass 2)
        run: |
          python3 scripts/migrate_mod_offsets.py work/libminecraftpe.so modsrc/src/FinalMod.cpp out/m1 || true
          python3 scripts/migrate_v2.py work/libminecraftpe.so modsrc/src/FinalMod.cpp out/m2 || true
      - name: Resolve hard targets structurally
        run: |
          python3 scripts/resolve_hard_targets.py work/libminecraftpe.so work/minecraft_re.db out/hard
      - name: Publish analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar --zstd -cf port-analysis.tar.zst -C out m1 m2 hard
          gh release upload "$RESULT_TAG" port-analysis.tar.zst --repo "${{ github.repository }}" --clobber
          cat out/hard/hard_targets.json | head -80
