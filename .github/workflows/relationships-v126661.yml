name: Relationship Analysis - 1.26.66.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PAYLOAD_TAG: v126661-payload
      RESULT_TAG: v126661-result
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils zstd
      - name: Download library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work out
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" --dir work --clobber
          sha256sum work/libminecraftpe.so | tee out/sha256.txt
      - name: Extract relationships
        run: |
          python3 scripts/build_relationship_pkg.py work/libminecraftpe.so out ""
          ls -lh out/relationships
      - name: Split large TSVs into chunks
        run: |
          cd out/relationships
          for f in RELATIONSHIP_CALLS.tsv RELATIONSHIP_STRINGS.tsv; do
            [ -f "$f" ] || continue
            head -1 "$f" > "hdr_$f"
            tail -n +2 "$f" | split -l 400000 -d -a 3 - "$f.part"
            for p in "$f".part*; do cat "hdr_$f" "$p" > "$p.tsv"; rm "$p"; done
            rm "$f" "hdr_$f"
          done
          ls -lh
      - name: Compress each file
        run: |
          cd out/relationships
          for f in *; do zstd -q -6 --rm "$f"; done
          ls -lh
      - name: Publish all parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/relationships
          for f in *.zst; do
            gh release upload "$RESULT_TAG" "$f" --repo "${{ github.repository }}" --clobber || echo "skip $f"
          done
          echo "--- published ---"
          gh release view "$RESULT_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -iE 'RELATIONSHIP|part' | head -40
