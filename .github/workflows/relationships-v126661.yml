name: Relationship Analysis - 1.26.66.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PAYLOAD_TAG: v126661-payload
      RESULT_TAG: v126661-result
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils zstd
      - name: Download library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work out
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" --dir work --clobber
          sha256sum work/libminecraftpe.so | tee out/sha256.txt
      - name: Get master table for name resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RESULT_TAG" --repo "${{ github.repository }}" --pattern 'reconstruction.tar.zst' --dir rec --clobber || true
          if [ -f rec/reconstruction.tar.zst ]; then tar --zstd -xf rec/reconstruction.tar.zst -C rec; find rec -name 'MASTER_OFFSET_SIGNATURE_TABLE.tsv' | head -1 > /tmp/m.txt; cat /tmp/m.txt; fi
          MASTER=$(cat /tmp/m.txt 2>/dev/null | head -1)
          echo "MASTER_FILE=$MASTER" >> "$GITHUB_ENV"
      - name: Extract relationships (pure python, no disassembler)
        run: |
          python3 scripts/build_relationship_pkg.py work/libminecraftpe.so out "$MASTER_FILE"
          ls -lh out/relationships
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar --zstd -T0 -6 -cf relationships.tar.zst -C out relationships
          ls -lh relationships.tar.zst
          gh release upload "$RESULT_TAG" relationships.tar.zst --repo "${{ github.repository }}" --clobber
