name: Relationship & Structure Analysis - 1.26.66.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PAYLOAD_TAG: v126661-payload
      RESULT_TAG: v126661-result
    steps:
      - uses: actions/checkout@v4
      - name: Download library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work out
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" --dir work --clobber
          sha256sum work/libminecraftpe.so | tee out/sha256.txt
          echo DOWNLOAD_OK
      - name: Full disassembly
        run: |
          objdump -d --no-show-raw-insn work/libminecraftpe.so | zstd -q -T4 -3 -o out/DISASSEMBLY_FULL.asm.zst
          echo "lines: $(zstd -dc out/DISASSEMBLY_FULL.asm.zst | wc -l)"
      - name: Extract relationships
        run: |
          python3 scripts/extract_relationships.py work/libminecraftpe.so out
          ls -lh out/relationships
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar --zstd -cf relationships.tar.zst -C out relationships
          gh release upload "$RESULT_TAG" relationships.tar.zst --repo "${{ github.repository }}" --clobber
